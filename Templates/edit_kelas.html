<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Kelas</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
{% extends "layout.html" %}

{% block title %}Job Logs{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Kelas</h2>
    <form method="POST">
        <div class="form-group">
            <label>id_kelas</label>
            <input type="text" name="id_kelas" value="{{ data.id_kelas }}" class="form-control" readonly>
        </div>

        <div class="form-group">
            <label>Kategori</label>
            <select name="id_cat_kelas" class="form-control" required>
                {% for cat in cat_kelas %}
                <option value="{{ cat.id_cat_kelas }}" {% if cat.id_cat_kelas == data.id_cat_kelas %}selected{% endif %}>
                    {{ cat.cat_kelas }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Guru kelas:</label>
            <select name="id_guru" class="form-control">
                {% for g in guru %}
                <option value="{{ g.id_guru }}" {% if g.id_guru == data.id_guru %}selected{% endif %}>
                    {{ g.nama_guru }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Nama kelas</label>
            <input type="text" name="nama_kelas" value="{{ data.nama_kelas }}" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Sekolah</label>
            <select name="id_sekolah" class="form-control" required>
                {% for s in sekolah %}
                <option value="{{ s.id_sekolah }}" {% if s.id_sekolah == data.id_sekolah %}selected{% endif %}>
                    {{ s.nama_sekolah }}
                </option>
                {% endfor %}
                <option value="add_new">Tambah Sekolah Baru.</option>
            </select>
        </div>

        <!-- Add more fields as needed -->
        <div class="d-flex flex-wrap gap-2">
            <button type="submit" class="btn btn-primary">Update</button>
            <button class="btn btn-secondary" onclick="history.back()">Back</button>
            <a href="{{ url_for('insert_kelas') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>

    <form method="POST" action="{{ url_for('delete_kelas', id=data.id_kelas) }}" onsubmit="return confirm('Are you sure you want to delete this kelas?');">
    <button type="submit" class="btn btn-danger">Delete</button>
    </form>

</div>

<script>
function checkAddNewSekolah() {
    var select = document.getElementById('id_sekolah');
    var value = select.value;
    if (value === 'add_new') {
        if (confirm('Nak tambah sekolah baru?')) {
            window.location.href = "{{ url_for('insert_sekolah') }}";
        }
    }
}
</script>

{% endblock %}
</body>
</html>
