<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit sekolah.</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
{% extends "layout.html" %}

{% block title %}Job Logs{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Sekolah.</h2>
    <form method="POST">
        <div class="form-group">
            <label>id_sekolah</label>
            <input type="text" name="id_sekolah" value="{{ data.id_sekolah }}" class="form-control" readonly>
        </div>

        <div class="form-group">
            <label>Sekolah</label>
            <input type="text" name="nama_sekolah" value="{{ data.nama_sekolah }}" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Alamat sekolah (line 1).</label>
            <input type="text" name="alamat_sekolah_line1" value="{{ data.alamat_sekolah_line1 }}" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Alamat sekolah (line 2)</label>
            <input type="text" name="alamat_sekolah_line2" value="{{ data.alamat_sekolah_line2 }}" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Alamat sekolah (line 3)</label>
            <input type="text" name="alamat_sekolah_line3" value="{{ data.alamat_sekolah_line3 }}" class="form-control" required>
        </div>

        <div class="form-group">
            <label>Telefon.</label>
            <input type="text" name="telefon_sekolah" value="{{ data.telefon_sekolah }}" class="form-control" required>
        </div>

        <!-- Add more fields as needed -->
        <div class="d-flex flex-wrap gap-2">
            <button type="submit" class="btn btn-primary">Update</button>
            <a href="{{ url_for('insert_sekolah') }}" class="btn btn-secondary">Cancel</a>
            <button class="btn btn-secondary" onclick="history.back()">Back</button>
        </div>
    </form>

    <form method="POST" action="{{ url_for('delete_sekolah', id=data.id_sekolah) }}" onsubmit="return confirm('Are you sure you want to delete this sekolah?');">
    <button type="submit" class="btn btn-danger">Delete</button>
    </form>

</div>

<script>
function checkAddNewSekolah() {
    var select = document.getElementById('id_sekolah');
    var value = select.value;
    if (value === 'add_new') {
        if (confirm('Nak tambah sekolah baru?')) {
            window.location.href = "{{ url_for('insert_sekolah') }}";
        }
    }
}
</script>

{% endblock %}
</body>

</html>
