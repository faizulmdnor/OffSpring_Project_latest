<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit peperiksaan</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
{% extends "layout.html" %}

{% block title %}Job Logs{% endblock %}

{% block content %}
<body>
<div class="container mt-4">
    <h2>Edit peperiksaan.</h2>
    <form method="POST">
        <div class="form-group">
            <label>id_peperiksaan.</label>
            <input type="text" name="id_peperiksaan" value="{{ data.id_peperiksaan }}" class="form-control" readonly>
        </div>
        <div class="form-group">
            <label>Nama peperiksaan.</label>
            <input type="text" name="nama_peperiksaan" value="{{ data.nama_peperiksaan }}" class="form-control" required>
        </div>
        <div class="form-group">
            <label>tahun_peperiksaan.</label>
            <input type="text" name="tahun_peperiksaan" value="{{ data.tahun_peperiksaan }}" class="form-control" required>
        </div>
        <div class="form-group">
            <label>tarikh_peperiksaan.</label>
            <input type="date" name="tarikh_peperiksaan" value="{{ data.tarikh_peperiksaan }}" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Nama:</label>
            <input type="text" name="Nama" value="{{ data.full_name }}" class="form-control" readonly>
            <label>Kelas:</label>
            <input type="text" name="Kelas" value="{{ data.nama_kelas }}" class="form-control" readonly>
            <label>Sekolah:</label>
            <input type="text" name="Sekolah" value="{{ data.nama_sekolah }}" class="form-control" readonly>
        </div>
        <div class="container mt-4">
            <button type="submit" class="btn btn-primary">Update</button>
            <button class="btn btn-secondary" onclick="history.back()">Back</button>
            <a href="{{ url_for('peperiksaan') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
    <div class="container mt-4">
        <form method="POST" action="{{ url_for('delete_peperiksaan', id=data.id_peperiksaan) }}" onsubmit="return confirm('Are you sure you want to delete this information?');">
            <button type="submit" class="btn btn-danger">Delete</button>
        </form>
    </div>
    </div>
</body>
{% endblock %}
</html>
