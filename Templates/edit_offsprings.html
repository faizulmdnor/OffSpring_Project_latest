<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Offspring</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
{% extends "layout.html" %}

{% block title %}Job Logs{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Edit Offspring</h2>
    <form method="POST">
        <div class="form-group">
            <label>id_person</label>
            <input type="text" name="id_person" value="{{ data.id_person }}" class="form-control" readonly>
        </div>
        <div class="form-group">
            <label>Nama</label>
            <input type="text" name="full_name" value="{{ data.full_name }}" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Kad pengenalan</label>
            <input type="text" name="kad_pengenalan" value="{{ data.kad_pengenalan }}" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Sijil kelahiran</label>
            <input type="text" name="sijil_kelahiran" value="{{ data.sijil_kelahiran }}" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Jantina</label>
            <input type="text" name="gender" value="{{ data.gender }}" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Email sekolah atau kerja</label>
            <input type="text" name="email_school_work" value="{{ data.email_school_work }}" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Email personal</label>
            <input type="text" name="email_personal" value="{{ data.email_personal }}" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Phone number</label>
            <input type="text" name="phone_number" value="{{ data.phone_number }}" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Kategori</label>
            <select name="id_cat" class="form-control" required>
                {% for cat in kategori %}
                <option value="{{ cat.id_cat }}" {% if cat.id_cat == data.id_cat %}selected{% endif %}>
                    {{ cat.category }}
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- Add more fields as needed -->
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
</body>
</html>
