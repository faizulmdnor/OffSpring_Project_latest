<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}My Portal{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
  <style>
    body {
      display: flex;
    }
    .sidebar {
      width: 220px;
      min-height: 100vh;
      background-color: #f8f9fa;
      padding: 1rem;
    }
    .sidebar a {
      display: block;
      padding: 10px;
      color: #000;
      text-decoration: none;
    }
    .sidebar a:hover {
      background-color: #ddd;
      border-radius: 5px;
    }
    .main-content {
      flex-grow: 1;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <a href="{{ url_for('index' )}}"><h4>OffSprings</h4></a>
    <a href="{{ url_for('persekolahan') }}">Persekolahan</a>
    <a href="{{ url_for('peperiksaan') }}">Peperiksaan</a>
    <a href="{{ url_for('keputusan_matapelajaran') }}">Keputusan matapelajaran</a>
  </div>

  <div class="main-content">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="container mt-3">
      {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="close" data-dismiss="alert" aria-label="Tutup">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      {% endfor %}
    </div>
    {% endif %}
    {% endwith %}
    {% block content %}
    {% endblock %}
  </div>
</body>
</html>
