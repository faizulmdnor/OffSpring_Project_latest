<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>edit_persekolahan</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
{% extends "layout.html" %}

{% block title %}Job Logs{% endblock %}

{% block content %}
<div class="container mt-4">
    <h2>Edit persekolahan.</h2>

    <div class="form-group">
        <h3>Maklumat asal.</h3>
        <label>id_persekolahan</label>
        <input type="text" name="data.id_persekolahan" value="{{ data.id_persekolahan }}" class="form-control" readonly>
        <label>Tahun</label>
        <input type="text" name="data.tahun_persekolahan" value="{{ data.tahun_persekolahan }}" class="form-control" readonly>
        <label>Nama</label>
        <input type="text" name="data.full_name" value="{{ data.full_name }}" class="form-control" readonly>
        <label>Kelas</label>
        <input type="text" name="data.nama_kelas" value="{{ data.nama_kelas }}" class="form-control" readonly>
    </div>

    <form method="POST">
        <h3>Maklumat baru.</h3>
        <div class="form-group">
            <label>Tahun</label>
            <input type="text" name="tahun_persekolahan" class="form-control" required>
        </div>
        <div class="form-group">
            <label>Nama:</label>
            <select name="id_person" class="form-control">
                {% for person in persons %}
                <option value="{{ person.id_person }}">
                    {{ person.full_name }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Kelas:</label>
            <select name="id_kelas" class="form-control">
                {% for kelas in data_kelas %}
                <option value="{{ kelas.id_kelas }}">
                    {{ kelas.nama_kelas }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group d-flex gap-2 mt-3">
            <a href="{{ url_for('insert_kelas') }}" class="btn btn-primary m-2">Tambah maklumat kelas.</a>
        </div>
        <div class="form-group d-flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary">Update</button>
        </div>
        <div class="form-group d-flex gap-2 mt-3">
            <a href="{{ url_for('persekolahan') }}" class="btn btn-secondary">Cancel</a>
        </div>
        <div class="form-group d-flex gap-2 mt-3">
            <button class="btn btn-secondary" onclick="history.back()">Back</button>
        </div>
    </form>
    <div class="form-group d-flex gap-2 mt-3">
        <form method="POST" action="{{ url_for('delete_persekolahan', id=data.id_persekolahan) }}" onsubmit="return confirm('Are you sure you want to delete this information?');">
            <button type="submit" class="btn btn-danger">Delete</button>
        </form>
    </div>
</div>
{% endblock %}
</body>
</html>
